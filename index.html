<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FikaSmart</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet"/>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#363B3E",
                        "primary-hover": "#474D50",
                        "on-primary": "#ffffff",
                        "primary-container": "#4A5054",
                        "on-primary-container": "#D6D9DB",
                        "secondary": "#B89953",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#EAD293",
                        "on-secondary-container": "#4D3D15",
                        "tertiary": "#7D8471",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#656D59",
                        "on-tertiary-container": "#E6E8E3",
                        "error": "#C85A5A",
                        "on-error": "#ffffff",
                        "error-container": "#F2DEDE",
                        "on-error-container": "#662222",
                        "background": "#FAF9F6",

                        "h3": ["Noto Sans", "sans-serif"],
                        "display": ["Noto Sans", "sans-serif"],

                        "price": ["Noto Sans", "sans-serif"],
                        "dimensions": ["JetBrains Mono", "monospace"]

                    fontSize: {

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .card-elevation {
            box-shadow: 0 1px 3px rgba(17,17,17,0.06);
        }
        /* Scrollbar hide */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body text-body antialiased selection:bg-secondary-container selection:text-on-secondary-container min-h-screen">
    <div id="app-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" charset="utf-8"></script>
    <script src="./js/bundle.js" charset="utf-8"></script>
