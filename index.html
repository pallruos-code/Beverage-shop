<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FikaSmart</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet"/>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#002068",
                        "primary-hover": "#002B80",
                        "on-primary": "#ffffff",
                        "primary-container": "#003399",
                        "on-primary-container": "#8aa4ff",
                        "secondary": "#6f5d00",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#fdd816",
                        "on-secondary-container": "#705e00",
                        "tertiary": "#012f00",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#034800",
                        "on-tertiary-container": "#4ebe3c",
                        "error": "#CC0008",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "background": "#F5F5F5",
                        "on-background": "#1b1c1c",
                        "surface": "#FFFFFF",
                        "on-surface": "#1b1c1c",
                        "surface-variant": "#e3e2e2",
                        "on-surface-variant": "#444653",
                        "outline": "#747684",
                        "outline-variant": "#c4c5d5",
                        "border": "#DFDFDF",
                        "text-primary": "#111111",
                        "text-secondary": "#484848",
                        "surface-container": "#efeded",
                        "surface-container-low": "#f5f3f3",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e9e8e7",
                        "surface-container-highest": "#e3e2e2",

                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",

                    spacing: {
                        "xs": "8px",
                        "sm": "12px",
                        "base": "4px",
                        "md": "16px",
                        "lg": "24px",
                        "xl": "32px",
                        "xxl": "64px",
                        "gutter-mobile": "8px",
                        "gutter-desktop": "20px",
                        "container-max": "1400px"
                    },
                    fontFamily: {
                        "body": ["Noto Sans", "sans-serif"],
                        "body-sm": ["Noto Sans", "sans-serif"],
                        "h1": ["Noto Sans", "sans-serif"],
                        "h1-mobile": ["Noto Sans", "sans-serif"],
                        "h2": ["Noto Sans", "sans-serif"],
                        "h3": ["Noto Sans", "sans-serif"],
                        "display": ["Noto Sans", "sans-serif"],
                        "label": ["Noto Sans", "sans-serif"],
                        "caption": ["Noto Sans", "sans-serif"],
                        "product-name": ["Noto Sans", "sans-serif"],
                        "price": ["Noto Sans", "sans-serif"],
                        "dimensions": ["JetBrains Mono", "monospace"]
                    },
                    fontSize: {
                        "body": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "body-sm": ["14px", { lineHeight: "21px", fontWeight: "400" }],
                        "h1": ["32px", { lineHeight: "41.6px", fontWeight: "700" }],
                        "h1-mobile": ["28px", { lineHeight: "36px", fontWeight: "700" }],
                        "h2": ["24px", { lineHeight: "31.2px", fontWeight: "700" }],
                        "h3": ["18px", { lineHeight: "23.4px", fontWeight: "700" }],
                        "display": ["40px", { lineHeight: "52px", fontWeight: "700" }],
                        "label": ["15px", { lineHeight: "20px", fontWeight: "700" }],
                        "caption": ["12px", { lineHeight: "18px", fontWeight: "400" }],
                        "product-name": ["16px", { lineHeight: "24px", fontWeight: "700" }],
                        "price": ["24px", { lineHeight: "31.2px", fontWeight: "700" }],
                        "dimensions": ["14px", { lineHeight: "21px", fontWeight: "400" }]
                    }
                }
            }
        }

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .card-elevation {
            box-shadow: 0 1px 3px rgba(17,17,17,0.06);
        }
        /* Scrollbar hide */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body text-body antialiased selection:bg-secondary-container selection:text-on-secondary-container min-h-screen">
    <div id="app-root"></div>
    <script src="./js/bundle.js"></script>
</body>
</html>
